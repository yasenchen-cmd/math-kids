<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>数学闯关 · 解锁码生成工具</title>
<style>
body{font-family:sans-serif;max-width:400px;margin:40px auto;padding:0 20px;text-align:center}
h1{font-size:1.3rem;color:#2D3436;margin-bottom:20px}
p{font-size:0.85rem;color:#636E72;margin-bottom:16px}
input{width:100%;padding:12px 16px;font-size:1rem;border:2px solid #E8ECF0;border-radius:12px;text-align:center;box-sizing:border-box;outline:none}
input:focus{border-color:#D4380D}
button{width:100%;padding:14px 0;margin-top:12px;background:#D4380D;color:#fff;border:none;border-radius:14px;font-size:1.1rem;font-weight:700;cursor:pointer}
.result{margin-top:20px;padding:16px;background:#F5F5F5;border-radius:12px;display:none}
.result .label{font-size:0.8rem;color:#999;margin-bottom:6px}
.result .code{font-size:1.2rem;font-weight:700;color:#2E7D32;word-break:break-all;user-select:all}
.result .hint{font-size:0.75rem;color:#999;margin-top:8px}
</style>
</head>
<body>
<h1>🔓 数学闯关 · 解锁码生成</h1>
<p>收到买家付款后，输入对方的设备 ID，生成解锁码发给他</p>
<input type="text" id="deviceId" placeholder="粘贴买家的设备 ID" autocomplete="off" />
<button onclick="generate()">生成解锁码</button>
<div class="result" id="result">
  <div class="label">将此解锁码发给买家</div>
  <div class="code" id="code"></div>
  <div class="hint">买家在 App 中输入此解锁码即可使用</div>
</div>
<script>
function generate() {
  const id = document.getElementById('deviceId').value.trim()
  if (!id) return alert('请输入设备 ID')
  const secret = 'mn-unlock-v1'
  const code = btoa(secret + ':' + id).replace(/=/g, '')
  document.getElementById('code').textContent = code
  document.getElementById('result').style.display = 'block'
}
</script>
</body>
</html>
